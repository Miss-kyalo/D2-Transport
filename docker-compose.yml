services:
  db:
    image: postgres:16-alpine
    container_name: d2_transport_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or project .env}
      POSTGRES_DB: ${POSTGRES_DB:-transport_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_phase1_init.sql:/docker-entrypoint-initdb.d/001_phase1_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: d2_transport_api
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 5000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${APP_DB_USER:-d2_app}
      PGPASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in the environment or project .env}
      APP_DB_USER: ${APP_DB_USER:-d2_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in the environment or project .env}
      PGDATABASE: ${POSTGRES_DB:-transport_db}
      PGSSL: ${PGSSL:-false}
      PGSSL_CA: ${PGSSL_CA:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment or project .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      EMAIL_MFA_ENABLED: ${EMAIL_MFA_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NODE_ENV: production
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  migrator:
    build: ./backend
    profiles: ["migrate"]
    command: ["node", "migrate.js"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or project .env}
      PGDATABASE: ${POSTGRES_DB:-transport_db}
      APP_DB_USER: ${APP_DB_USER:-d2_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in the environment or project .env}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: