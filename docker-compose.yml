services:
  db:
    image: postgres:16-alpine
    container_name: d2_transport_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: d2_password_2026
      POSTGRES_DB: transport_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    container_name: d2_transport_api
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:d2_password_2026@db:5432/transport_db
      JWT_SECRET: d2-transport-jwt-secret-2026
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db

volumes:
  pgdata: