services:
  db:
    image: postgres:16-alpine
    container_name: d2_transport_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or project .env}
      POSTGRES_DB: ${POSTGRES_DB:-transport_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    container_name: d2_transport_api
    environment:
      PORT: 5000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or project .env}
      PGDATABASE: ${POSTGRES_DB:-transport_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment or project .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db

volumes:
  pgdata: